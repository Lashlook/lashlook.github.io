<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запись</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2563eb; --err:#dc2626; --ok:#16a34a; --border:#d9dce1; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121417; --card:#1c1f24; --text:#e8eaed; --muted:#9aa0a6; --border:#33373d; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; }
  h1 { margin:0 0 4px; font-size:24px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  label { display:block; font-size:14px; margin:14px 0 6px; }
  input, textarea { width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  textarea { min-height:100px; resize:vertical; }
  input:focus, textarea:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:600 16px system-ui; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:14px; min-height:1.5em; font-size:14px; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
</style>
</head>
<body>
<main class="card">
  <h1>Записаться</h1>
  <p class="sub">Оставьте свои данные — мы с вами свяжемся.</p>
  <form id="f" novalidate>
    <label for="name">Имя *</label>
    <input id="name" name="name" maxlength="100" required autocomplete="name">
    <label for="email">Email *</label>
    <input id="email" name="email" type="email" maxlength="200" required autocomplete="email">
    <label for="message">Сообщение</label>
    <textarea id="message" name="message" maxlength="2000"></textarea>
    <button id="btn" type="submit">Отправить</button>
    <div id="msg" class="msg" role="status"></div>
  </form>
</main>
<script>
let API = null;
const apiReady = fetch('config.json?t=' + Date.now(), { cache: 'no-store' })
  .then(r => r.json()).then(c => { API = c.api; }).catch(() => {});
const f = document.getElementById('f'), btn = document.getElementById('btn'), msg = document.getElementById('msg');
const show = (text, cls) => { msg.textContent = text; msg.className = 'msg ' + cls; };
f.addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(f));
  if (!data.name.trim()) return show('Укажите имя', 'err');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email.trim())) return show('Проверьте email', 'err');
  btn.disabled = true; show('Отправка…', '');
  try {
    await apiReady;
    if (!API) throw new Error('Запись временно недоступна, попробуйте позже');
    const r = await fetch(API + '/api/records', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Ошибка');
    f.reset(); show('Готово! Вы записаны ✅', 'ok');
  } catch (err) { show(err instanceof TypeError ? 'Запись временно недоступна, попробуйте позже' : err.message, 'err'); }
  finally { btn.disabled = false; }
});
</script>
</body>
</html>
